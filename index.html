<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoppable Catalog Exercise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="page-container">
        <h1 class="main-heading">Shoppable Catalog Exercise</h1>

        <div class="button-bar">
            <!-- Distinct classes added to each in case you want to style them individually -->
            <button class="flipbook-btn btn-1" data-flipbook-url="https://viewer.ipaper.io/mka-test/shopping-catalog-exercise/madam-stoltz/">
              <span class="card-title">MADAM STOLTZ</span>
              <div class="card-media">
<iframe src="https://viewer.ipaper.io/mka-test/shopping-catalog-exercise/madam-stoltz/-/embedded/perspective/spread/1/" style="display:block;" allow="fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen scrolling="no" frameborder="0"></iframe>              </div>
            </button>

            <button class="flipbook-btn btn-2" data-flipbook-url="https://viewer.ipaper.io/mka-test/kleemarkt/kleemarkt/">
              <span class="card-title">KLEEMARKT</span>
              <div class="card-media">
<iframe src="https://viewer.ipaper.io/mka-test/testing/kleemarkt/-/embedded/perspective/spread/1/" style="display:block;" allow="fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen scrolling="no" frameborder="0"></iframe>              </div>
            </button>

            <button class="flipbook-btn btn-3" data-flipbook-url="https://viewer.ipaper.io/mka-test/oriflame/oriflame/">
              <span class="card-title">ORIFLAME</span>
  <div class="card-media">
   <iframe src="https://viewer.ipaper.io/mka-test/oriflame/oriflame/-/embedded/perspective/spread/1/" style="display:block;" allow="fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen scrolling="no" frameborder="0"></iframe>
  </div>
            </button>

            <button class="flipbook-btn btn-4" data-flipbook-url="https://viewer.ipaper.io/mka-test/just/just/">
              <span class="card-title">SWISS JUST</span>
              <div class="card-media">
<iframe src="https://viewer.ipaper.io/mka-test/just/just/-/embedded/perspective/spread/1/" style="display:block;" allow="fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen scrolling="no" frameborder="0"></iframe>              </div>
            </button>

            <button class="flipbook-btn btn-5" data-flipbook-url="https://viewer.ipaper.io/mka-test/marrodent/marrodent/">
              <span class="card-title">MARRODENT</span>
              <div class="card-media">
                <iframe id="preview-frame" src="https://viewer.ipaper.io/mka-test/marrodent/marrodent/-/embedded/perspective/spread/1/" style="display:block;" allow="fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen scrolling="no" frameborder="0"></iframe>
              </div>
            </button>
        </div>

    <!-- Flipbook Modal Overlay -->
<div id="flipbook-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal-content">
    <button id="modal-close" class="modal-close-btn" aria-label="Close modal">&times;</button>
    <iframe 
  id="flipbook-frame"
  src="about:blank"
  style="width: 100%; height: 100%; display: block; border: none;"
  scrolling="no"
  frameborder="0"
  allow="autoplay; fullscreen; web-share; clipboard-write;"
  allowfullscreen
  webkitallowfullscreen
  mozallowfullscreen>
</iframe>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
